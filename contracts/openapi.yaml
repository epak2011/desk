openapi: 3.1.0
info:
  title: Trading Desk Frontend API
  version: 2.0.0
  description: >-
    Presentation-neutral boundary for Trading Desk. The API returns canonical
    engine decisions; clients must never recreate or modify investment rules.
servers:
  - url: https://api.example.com
    description: Replace with the deployed API origin.
security:
  - supabaseBearer: []
tags:
  - name: Shared
  - name: Workspace
  - name: Operations
paths:
  /v1/health:
    get:
      tags: [Operations]
      security: []
      summary: Lightweight service readiness check
      responses:
        "200":
          description: Service is available
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthResponse"}
  /v1/regime:
    get:
      tags: [Shared]
      security: []
      summary: Latest saved canonical market regime
      responses:
        "200":
          description: Current market regime
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegimeResponse"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /v1/regime/requests:
    post:
      tags: [Shared]
      summary: Queue a canonical market-regime refresh
      responses:
        "202": {description: Market refresh queued; poll the returned poll_url}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /v1/regime-requests/{job_id}:
    get:
      tags: [Operations]
      summary: Poll an authenticated market-regime refresh
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: Refresh status and canonical regime when ready}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/decisions/{ticker}:
    get:
      tags: [Shared]
      security: []
      summary: Canonical stock decision
      parameters:
        - $ref: "#/components/parameters/Ticker"
      responses:
        "200":
          description: Decision receipt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DecisionResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidTicker"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /v1/decisions/{ticker}/requests:
    post:
      tags: [Shared]
      summary: Return a saved decision or queue canonical analysis for a missing ticker
      parameters:
        - $ref: "#/components/parameters/Ticker"
      responses:
        "200": {description: A canonical decision is already available}
        "202": {description: Analysis was queued; poll the returned poll_url}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/InvalidTicker"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /v1/decisions/{ticker}/research/requests:
    post:
      tags: [Shared]
      summary: Return saved AI research or queue a current full report
      description: Research enriches explanations only and never changes the canonical rules action.
      parameters:
        - $ref: "#/components/parameters/Ticker"
      responses:
        "200": {description: Saved research is already available}
        "202": {description: Research was queued; poll the returned poll_url}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/InvalidTicker"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /v1/analysis-requests/{job_id}:
    get:
      tags: [Operations]
      summary: Poll an authenticated analysis request
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: Current request status and the canonical decision when ready}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /v1/workspace:
    get:
      tags: [Workspace]
      summary: Authenticated user's private workspace
      responses:
        "200":
          description: User-owned state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    patch:
      tags: [Workspace]
      summary: Update supported private workspace sections
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspacePatch"}
      responses:
        "200":
          description: Updated user-owned state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/watchlist:
    get:
      tags: [Workspace]
      summary: Authenticated watchlist with current decision summaries
      responses:
        "200":
          description: Ordered watchlist
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WatchlistResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/watchlist/{ticker}:
    put:
      tags: [Workspace]
      summary: Add a ticker to the authenticated user's watchlist
      parameters:
        - $ref: "#/components/parameters/Ticker"
      responses:
        "200":
          description: Updated watchlist
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WatchlistResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/InvalidTicker"}
    delete:
      tags: [Workspace]
      summary: Remove a ticker from the authenticated user's watchlist
      parameters:
        - $ref: "#/components/parameters/Ticker"
      responses:
        "204": {description: Removed}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/attention:
    get:
      tags: [Workspace]
      summary: Current material attention events for the user
      responses:
        "200":
          description: Ordered attention events
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AttentionResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/portfolio:
    get:
      tags: [Workspace]
      summary: User holdings and portfolio-aware decision context
      responses:
        "200":
          description: User portfolio
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/calibration:
    get:
      tags: [Operations]
      summary: Versioned engine calibration summary
      responses:
        "200":
          description: Read-only calibration evidence
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenericResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/operator/engine-updates:
    get:
      tags: [Operations]
      summary: Owner-only rules and engine update feed
      description: >-
        Canonical governance history shared by Streamlit and approved frontends.
        The API verifies the Supabase identity and requires the configured owner email.
      responses:
        "200":
          description: Versioned engine update feed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EngineUpdatesResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
components:
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token. The API derives user_id from the verified JWT only.
  parameters:
    Ticker:
      name: ticker
      in: path
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9.-]{1,15}$"}
  responses:
    Unauthorized:
      description: Missing or invalid Supabase session
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    Forbidden:
      description: Authenticated identity is not the configured owner
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    NotFound:
      description: No canonical result exists for the ticker
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    InvalidTicker:
      description: Ticker is invalid or unsupported
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    Conflict:
      description: Workspace revision is stale
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    ServiceUnavailable:
      description: Required data or engine service is unavailable
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
  schemas:
    Meta:
      type: object
      required: [contract_version, generated_at, engine_version, freshness]
      properties:
        contract_version: {type: integer, const: 2}
        generated_at: {type: string, format: date-time}
        engine_version: {type: string}
        data_as_of: {type: [string, "null"], format: date-time}
        freshness: {type: string, enum: [live, fresh, delayed, stale, blocked, expired, unknown]}
        stale: {type: boolean}
        refresh_required: {type: boolean}
        refresh: {type: object, additionalProperties: true}
        display: {type: object, additionalProperties: true}
        request_id: {type: [string, "null"]}
    PriceLevel:
      type: object
      properties:
        text: {type: string}
        price: {type: [number, "null"]}
    DataTrust:
      type: object
      additionalProperties: true
      properties:
        status: {type: string, enum: [trusted, caution, blocked, unknown]}
        executable: {type: boolean}
        as_of: {type: [string, "null"], format: date-time}
        freshness: {type: string}
        issues: {type: array, items: {type: string}}
    Decision:
      type: object
      required: [receipt_id, ticker, engine_version, action, trigger, invalidation]
      properties:
        receipt_id: {type: string}
        ticker: {type: string}
        captured_at: {type: string, format: date-time}
        engine_version: {type: string}
        action:
          type: string
          enum: [enter_now, accumulate, watch, hold_off, avoid]
        price: {type: [number, "null"]}
        market_regime: {type: [string, "null"]}
        setup_score: {type: [number, "null"]}
        confidence: {type: [string, number, "null"]}
        entry_size: {}
        setup_stage: {type: [string, "null"]}
        top_factors: {type: array, maxItems: 3, items: {type: string}}
        primary_risk: {type: string}
        trigger: {$ref: "#/components/schemas/PriceLevel"}
        invalidation: {$ref: "#/components/schemas/PriceLevel"}
        data_trust: {$ref: "#/components/schemas/DataTrust"}
        change_summary: {type: array, items: {type: string}}
    DecisionResponse:
      type: object
      required: [contract_version, meta, decision, portfolio_context, research, executable]
      properties:
        contract_version: {type: integer, const: 2}
        meta: {$ref: "#/components/schemas/Meta"}
        decision: {$ref: "#/components/schemas/Decision"}
        portfolio_context: {type: object, additionalProperties: true}
        research: {$ref: "#/components/schemas/Research"}
        executable: {type: boolean}
    Research:
      type: object
      required: [status, ticker, drivers, risks, quality]
      properties:
        status: {type: string, enum: [ready, stale, unavailable]}
        ticker: {type: string}
        company_name: {type: [string, "null"]}
        company_overview: {type: [string, "null"]}
        thesis: {type: [string, "null"]}
        drivers: {type: array, items: {type: string}}
        risks: {type: array, items: {type: string}}
        valuation: {type: [string, "null"]}
        timing_watchpoint: {type: [string, "null"]}
        decision_memo: {type: [string, "null"]}
        technical_narrative: {type: [string, "null"]}
        pm_narrative: {type: [string, "null"]}
        quality: {type: object, additionalProperties: true}
        generated_at: {type: [string, "null"]}
        age_days: {type: [integer, "null"], minimum: 0}
        stale_reasons: {type: array, items: {type: string}}
        source: {type: [string, "null"]}
    RegimeResponse:
      type: object
      required: [contract_version, meta, regime]
      properties:
        contract_version: {type: integer, const: 2}
        meta: {$ref: "#/components/schemas/Meta"}
        regime: {type: object, additionalProperties: true}
    WatchlistItem:
      type: object
      required: [ticker]
      properties:
        ticker: {type: string}
        company_name: {type: [string, "null"]}
        price: {type: [number, "null"]}
        change_pct: {type: [number, "null"]}
        action: {type: [string, "null"]}
        confidence: {type: [string, number, "null"]}
        trigger_price: {type: [number, "null"]}
        invalidation_price: {type: [number, "null"]}
        attention_priority: {type: [string, "null"]}
        data_trust: {$ref: "#/components/schemas/DataTrust"}
    WatchlistResponse:
      type: object
      required: [contract_version, meta, items, count]
      properties:
        contract_version: {type: integer, const: 2}
        meta: {$ref: "#/components/schemas/Meta"}
        items: {type: array, items: {$ref: "#/components/schemas/WatchlistItem"}}
        count: {type: integer, minimum: 0}
    AttentionResponse:
      type: object
      required: [contract_version, meta, events, count]
      properties:
        contract_version: {type: integer, const: 2}
        meta: {$ref: "#/components/schemas/Meta"}
        events: {type: array, items: {type: object, additionalProperties: true}}
        count: {type: integer, minimum: 0}
    Workspace:
      type: object
      additionalProperties: false
      properties:
        watchlist: {type: array, items: {type: string}}
        holdings: {type: object, additionalProperties: true}
        notes: {type: object, additionalProperties: true}
        position_notes: {type: object, additionalProperties: true}
        settings: {type: object, additionalProperties: true}
        notification_preferences: {type: object, additionalProperties: true}
    WorkspaceResponse:
      type: object
      required: [contract_version, meta, workspace]
      properties:
        contract_version: {type: integer, const: 2}
        meta: {$ref: "#/components/schemas/Meta"}
        workspace: {$ref: "#/components/schemas/Workspace"}
    WorkspacePatch:
      allOf:
        - $ref: "#/components/schemas/Workspace"
        - type: object
          properties:
            revision: {type: [string, "null"]}
    ErrorResponse:
      type: object
      required: [meta, error]
      properties:
        meta: {$ref: "#/components/schemas/Meta"}
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            detail: {type: string}
    HealthResponse:
      type: object
      required: [status, contract_version]
      properties:
        status: {type: string, enum: [ok, degraded]}
        contract_version: {type: integer, const: 2}
        engine_version: {type: string}
    GenericResponse:
      type: object
      additionalProperties: true
    EngineUpdate:
      type: object
      required: [date, title, status, summary, changes, validation]
      properties:
        date: {type: string, format: date}
        title: {type: string}
        status: {type: string}
        summary: {type: string}
        changes: {type: array, items: {type: string}}
        validation: {type: string}
    EngineUpdatesResponse:
      type: object
      required: [contract_version, generated_at, updates, count]
      properties:
        contract_version: {type: integer, const: 1}
        generated_at: {type: string, format: date-time}
        updates: {type: array, items: {$ref: "#/components/schemas/EngineUpdate"}}
        count: {type: integer, minimum: 0}
