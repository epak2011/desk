name: Verify Trading Desk deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: trading-desk-deployment-verification
  cancel-in-progress: true

jobs:
  verify-render-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Wait for Render and verify the public contract
        run: >-
          python3 scripts/verify_deployment.py
          --base-url https://trading-desk-api-ofxs.onrender.com
          --revision "${GITHUB_SHA}"
          --attempts 24
          --interval 15
