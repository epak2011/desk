name: Compare versioned Trading Desk rules
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: Comma-separated fixed historical universe (max 30)
        required: true
        default: AAPL,MSFT,NVDA,AMZN,GOOGL
      start:
        description: First sample date YYYY-MM-DD (450-day warm-up downloaded)
        required: true
        default: '2024-01-02'
      end:
        description: Last completed sample date YYYY-MM-DD
        required: true
        default: '2026-10-14'
      validation_start:
        description: Preselected validation start YYYY-MM-DD (no automatic tuning)
        required: true
        default: '2026-01-02'
      study:
        description: Standard archived comparison or additional frozen-event entry arms
        type: choice
        options:
          - standard
          - event
        default: standard
      tests_only:
        description: Run all tests without downloading data or replacing the replay summary
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rules-replay
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify simulator invariants
        run: python -m unittest discover -s tests -v
      - name: Replay and publish owner summary
        if: ${{ inputs.tests_only != true }}
        env:
          REPLAY_TICKERS: ${{ inputs.tickers }}
          REPLAY_START: ${{ inputs.start }}
          REPLAY_END: ${{ inputs.end }}
          REPLAY_VALIDATION: ${{ inputs.validation_start }}
          # Active reports never use calendar exits. Legacy reproduction is
          # archive-only through the CLI, not selectable in this workflow.
          REPLAY_EXIT_POLICY: signal_invalidation
          REPLAY_STUDY: ${{ inputs.study || 'standard' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python scripts/run_rules_replay.py --tickers "$REPLAY_TICKERS"
          --start "$REPLAY_START" --end "$REPLAY_END"
          --validation-start "$REPLAY_VALIDATION"
          --exit-policy "$REPLAY_EXIT_POLICY"
          --study "$REPLAY_STUDY"
          --output-dir replay-artifact --publish
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.tests_only != true }}
        with:
          name: versioned-rules-replay-${{ github.run_id }}
          path: replay-artifact/
          retention-days: 90
