name: Forward paper portfolio versus benchmarks
on:
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * 1-5'
  push:
    branches: [main]
    paths:
      - research/forward-paper-110-v4.json
permissions:
  contents: read
concurrency:
  group: forward-paper-110
  cancel-in-progress: false
jobs:
  collect-and-account:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python scripts/run_forward_paper.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
