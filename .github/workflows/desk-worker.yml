name: Trading Desk worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: trading-desk-worker
  cancel-in-progress: false

jobs:
  drain-refresh-queue:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.NTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
      NTHROPIC_API_KEY: ${{ secrets.NTHROPIC_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      WORKER_NAME: github-actions-worker
    steps:
      - name: Check out repository
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Check database secret
        id: database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL is not configured. Add the GitHub Actions DATABASE_URL secret to enable background refresh jobs."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Claude secret
        if: steps.database.outputs.configured == 'true'
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Claude API key is not configured. Add ANTHROPIC_API_KEY to repository secrets. The worker will still refresh market data, but PM memos and reports will fail."
          else
            echo "Claude API key is available to the worker."
          fi

      - name: Set up Python
        if: steps.database.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Worker disabled until DATABASE_URL is added
        if: steps.database.outputs.configured != 'true'
        run: |
          echo "Worker disabled: DATABASE_URL is not configured in GitHub Actions secrets."
          echo "Add DATABASE_URL to repository secrets to enable background refresh jobs."

      - name: Drain queued refresh jobs safely
        if: steps.database.outputs.configured == 'true'
        shell: bash
        run: |
          set +e

          if [ ! -f "worker.py" ]; then
            echo "::warning::Repository checkout did not provide worker.py; scheduled worker skipped."
            exit 0
          fi

          PYTHON_BIN="$(command -v python3 || command -v python)"
          if [ -z "$PYTHON_BIN" ]; then
            echo "::warning::Python is not available on this runner; scheduled worker skipped."
            exit 0
          fi

          "$PYTHON_BIN" --version
          "$PYTHON_BIN" -m pip install -r requirements.txt
          install_status=$?
          if [ "$install_status" -ne 0 ]; then
            echo "::warning::Dependency install failed with status ${install_status}; scheduled worker skipped."
            exit 0
          fi

          "$PYTHON_BIN" worker.py --maintenance --drain --max-jobs 10 --max-runtime-seconds 240 --market-max-age-minutes 10 --job-types market_snapshot,watchlist_market_scan
          worker_status=$?
          if [ "$worker_status" -ne 0 ]; then
            echo "::warning::Worker exited with status ${worker_status}; scheduled maintenance is treated as a soft failure to avoid notification spam."
          fi

          exit 0
