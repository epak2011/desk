name: Trading Desk worker

on:
  workflow_dispatch:
  schedule:
    - cron: "5-55/5 13-21 * * 1-5"
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-desk-worker
  cancel-in-progress: false

jobs:
  drain-refresh-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NTHROPIC_API_KEY: ${{ secrets.NTHROPIC_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      WORKER_NAME: github-actions-worker
      NOTIFICATIONS_ENABLED: ${{ secrets.NOTIFICATIONS_ENABLED }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
      UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
      APP_BASE_URL: https://tradingdesk.streamlit.app
      DIGEST_SEND_HOUR_ET: "17"
    steps:
      - name: Choose market-hours or hourly maintenance cadence
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PYTHON'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          market = now.weekday() < 5 and (9, 30) <= (now.hour, now.minute) < (16, 0)
          run = os.environ["EVENT_NAME"] != "schedule" or os.environ.get("SCHEDULE") == "17 * * * *" or market
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run={str(run).lower()}\n")
          print(f"Worker cadence: {'market-hours' if market else 'hourly off-hours'}; run={run}")
          PYTHON

      - name: Check out repository
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Drain queued refresh jobs safely
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          echo "Starting Trading Desk background worker."
          JOB_START_TS=$(date +%s)
          echo "$JOB_START_TS" > /tmp/job_start_ts

          if [ -n "$ANTHROPIC_API_KEY" ]; then
            export ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
          elif [ -n "$NTHROPIC_API_KEY" ]; then
            export ANTHROPIC_API_KEY="$NTHROPIC_API_KEY"
          elif [ -n "$CLAUDE_API_KEY" ]; then
            export ANTHROPIC_API_KEY="$CLAUDE_API_KEY"
          fi

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not configured. Add the GitHub Actions DATABASE_URL secret to enable background refresh jobs."
            exit 1
          fi

          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Claude API key is not configured. Market data jobs can run, but PM memo/report jobs will be skipped or fail softly."
          fi

          if [ ! -f "worker.py" ]; then
            echo "::error::Repository checkout did not provide worker.py."
            exit 1
          fi

          PYTHON_BIN="$(command -v python3 || command -v python)"
          if [ -z "$PYTHON_BIN" ]; then
            echo "::error::Python is not available on this runner."
            exit 1
          fi

          "$PYTHON_BIN" --version
          "$PYTHON_BIN" -m pip install -r requirements.txt
          install_status=$?
          if [ "$install_status" -ne 0 ]; then
            echo "::error::Dependency install failed with status ${install_status}."
            exit "$install_status"
          fi

          "$PYTHON_BIN" worker.py --maintenance --drain --max-jobs 10 --max-runtime-seconds 180 --market-max-age-minutes 10 --job-types market_snapshot,watchlist_market_scan,market_regime_daily,repair_missing_data,full_report,idea_discovery
          worker_status=$?
          if [ "$worker_status" -ne 0 ]; then
            echo "::error::Worker exited with status ${worker_status}."
          fi

          echo "Trading Desk worker finished (status ${worker_status})."
          exit "$worker_status"

