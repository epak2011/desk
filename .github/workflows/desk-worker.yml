name: Trading Desk worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: trading-desk-worker
  cancel-in-progress: false

jobs:
  drain-refresh-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WORKER_NAME: github-actions-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check database secret
        id: database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL is not configured. Add the GitHub Actions DATABASE_URL secret to enable background refresh jobs."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.database.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.database.outputs.configured == 'true'
        run: pip install -r requirements.txt

      - name: Worker disabled until DATABASE_URL is added
        if: steps.database.outputs.configured != 'true'
        run: |
          echo "Worker disabled: DATABASE_URL is not configured in GitHub Actions secrets."
          echo "Add DATABASE_URL to repository secrets to enable background refresh jobs."

      - name: Drain queued refresh jobs
        if: steps.database.outputs.configured == 'true'
        run: python worker.py --maintenance --drain --max-jobs 25 --market-max-age-minutes 10
