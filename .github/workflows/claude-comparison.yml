name: Score independent Claude comparison
on:
  workflow_dispatch:
    inputs:
      verify_ticker:
        description: Optional single live research verification (uses Claude credits)
        type: choice
        options:
          - none
          - DASH
          - BE
        default: none
  schedule:
    - cron: '20 22 * * 1-5'
permissions:
  contents: read
concurrency:
  group: independent-claude-comparison
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Verify one independent research generation
        if: ${{ inputs.verify_ticker == 'DASH' || inputs.verify_ticker == 'BE' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTHROPIC_API_KEY: ${{ secrets.NTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          VERIFY_TICKER: ${{ inputs.verify_ticker }}
        run: |
          python scripts/verify_research_generation.py
      - name: Publish immutable paired checkpoints
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/score_claude_comparison.py
